[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_API_URL = "https://api.futarchy.fi"
  NEXT_PUBLIC_POOL_API_URL = "https://api.futarchy.fi"
  NEXT_PUBLIC_API_VERSION = "v1"
  NEXT_PUBLIC_RPC_URL = "https://rpc.gnosischain.com"
  NEXT_PUBLIC_SUPABASE_URL = "https://nvhqdqtlsdboctqjcelq.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52aHFkcXRsc2Rib2N0cWpjZWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDIxNDU3ODEsImV4cCI6MjA1NzcyMTc4MX0.6kjpxGVqSQNMz3DqycuNPv_ug8sdBNKeJsN0Z3X7oLg"
  NEXT_PUBLIC_DATA_SOURCE = "supabase"
  NEXT_PUBLIC_DEBUG_MODE = "false"
  NEXT_PUBLIC_USE_DEFAULT_MOCK_METADATA = "true"
  NEXT_PUBLIC_USE_MOCK_SNAPSHOT = "false"

# Deploy previews on PRs
[context.deploy-preview]
  command = "npm install --legacy-peer-deps && npm run build"

# Branch deploys
[context.branch-deploy]
  command = "npm install --legacy-peer-deps && npm run build"

# The first GIP-153 deployment had empty pools at a stale opening price and was
# archived. Keep old bookmarks from landing on a dead market after its static
# page is removed from src/config/markets.js.
[[redirects]]
  from = "/markets/0x1d1f3b43f3c61b815041e9092b1ba7ca37c63262"
  to = "/markets/0x4120de9931fd29c8a6effea4df57a7c8760c1677"
  status = 301
  force = true

# The first NVDA / Jensen Huang market (2026-11-12) could only be settled after
# its deadline. It was replaced within hours by one that can settle as soon as
# the event happens. Links to the old one, in both URL forms, go to the new one.
[[redirects]]
  from = "/markets/0x9693989ef16c43274d0b85138baf22f21651970a"
  to = "/markets/0x9693b5d541b64c370987a3b2a569d8db96c4d38e"
  status = 301
  force = true

[[redirects]]
  from = "/market"
  to = "/market?proposalId=0x9693b5d541B64c370987A3b2A569d8db96c4D38E"
  status = 302
  force = true
  query = {proposalId = "0x9693989ef16c43274d0b85138baf22f21651970a"}

[[redirects]]
  from = "/market"
  to = "/market?proposalId=0x9693b5d541B64c370987A3b2A569d8db96c4D38E"
  status = 302
  force = true
  query = {proposalId = "0x9693989EF16C43274D0b85138BaF22F21651970a"}

# Short links to share. Each one is a single edge redirect to the market's static page,
# which carries the link-preview tags, so it costs no extra page load work.
# 302, not 301, so a short link can be pointed at a later market.
[[redirects]]
  from = "/nvda"
  to = "/markets/0x9693b5d541b64c370987a3b2a569d8db96c4d38e"
  status = 302
  force = true

[[redirects]]
